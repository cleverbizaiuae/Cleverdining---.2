[build]
  command = "CI=false npm install && npm run build"
  publish = "dist"

[build.environment]
  # API URL defaults to /api which uses the proxy below
  VITE_API_URL = "/api"
  VITE_WS_URL = "wss://cleverdining-2.onrender.com"

# API proxy redirect (must come first)
[[redirects]]
  from = "/api/*"
  to = "https://cleverdining-2.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/owners/*"
  to = "https://cleverdining-2.onrender.com/owners/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/message/*"
  to = "https://cleverdining-2.onrender.com/message/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/token/*"
  to = "https://cleverdining-2.onrender.com/token/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/adminapi/*"
  to = "https://cleverdining-2.onrender.com/adminapi/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/profile/*"
  to = "https://cleverdining-2.onrender.com/profile/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

# SPA fallback - redirect all other routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# --- Cache Control Headers ---
# HTML: browsers revalidate, while Netlify edge keeps the SPA shell warm.
# This keeps deploys safe because Vite asset filenames are content-hashed.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

[[headers]]
  for = "/scan-table"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

[[headers]]
  for = "/login"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

[[headers]]
  for = "/splash"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

[[headers]]
  for = "/dashboard"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

[[headers]]
  for = "/thankyou"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=3600, durable"

# Service Worker: never cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifest: short cache
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets (JS, CSS): long-lived immutable cache (hash in filename)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable, durable"

# Images: long cache
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"
