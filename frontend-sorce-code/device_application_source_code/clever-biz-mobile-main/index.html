<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CleverDining" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>CleverDining</title>
  <!-- Preconnect to API backend for faster first requests -->
  <link rel="preconnect" href="https://cleverdining-2.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://cleverdining-2.onrender.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Recovery UI styles (inline to prevent blank screen) -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--startup-background, linear-gradient(160deg, #0055FEdd 0%, #0055FE 100%));
      z-index: 99999;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    #app-loader .spinner {
      display: none;
      width: 36px;
      height: 36px;
      border: 3px solid #E5E7EB;
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #app-loader .brand {
      display: none;
      font-size: 22px;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    #app-loader .status {
      display: none;
      font-size: 13px;
      color: #94A3B8;
      margin-top: 12px;
    }

    #app-loader .offline-msg {
      font-size: 14px;
      color: #EF4444;
      margin-top: 8px;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- PWA Smart Refresh Guard (runs BEFORE React to prevent blank screens) -->
  <script>
    (function () {
      'use strict';

      // Match the synchronous startup shell to the cached restaurant theme.
      // This prevents a white/platform loader flash before React paints.
      try {
        var storedUser = JSON.parse(localStorage.getItem('userInfo') || '{}');
        var startupRestaurantId = storedUser && storedUser.user && storedUser.user.restaurants &&
          storedUser.user.restaurants[0] && storedUser.user.restaurants[0].id;
        var scopedBrandKey = startupRestaurantId
          ? 'cb_brand_config_cache:' + String(startupRestaurantId)
          : '';
        var cachedBrand = scopedBrandKey
          ? JSON.parse(localStorage.getItem(scopedBrandKey) || '{}')
          : {};
        var primary = /^#[0-9a-fA-F]{6}$/.test(cachedBrand.primaryColor || '')
          ? cachedBrand.primaryColor
          : '#0055FE';
        var startupBackground = cachedBrand.themePreset === 'luxury_dark'
          ? 'linear-gradient(160deg, #0f0f0f 0%, #1a1a2e 100%)'
          : cachedBrand.themePreset === 'warm_casual'
            ? 'linear-gradient(160deg, #7c2d12 0%, #c2410c 100%)'
            : 'linear-gradient(160deg, ' + primary + 'dd 0%, ' + primary + ' 100%)';
        document.documentElement.style.setProperty('--startup-background', startupBackground);
      } catch (_) {
        // The default platform gradient remains available.
      }

      // -- Offline detection --
      if (!navigator.onLine) {
        window.addEventListener('DOMContentLoaded', function () {
          var el = document.getElementById('offline-msg');
          if (el) el.style.display = 'block';
          var status = document.getElementById('loader-status');
          if (status) status.textContent = 'Waiting for connection…';
        });
        // Listen for reconnection, then reload
        window.addEventListener('online', function () {
          window.location.reload();
        });
        return; // Don't auto-refresh while offline
      }

      // -- Auto-refresh guard (max 1 per session) --
      var REFRESH_KEY = 'cleverdining_auto_refreshed';
      var alreadyRefreshed = sessionStorage.getItem(REFRESH_KEY) === 'true';

      // 5-second timeout: if app hasn't rendered, force ONE refresh
      var appReadyTimeout = setTimeout(function () {
        var root = document.getElementById('root');
        // Check if React has actually rendered content
        if (root && root.children.length === 0 && !alreadyRefreshed) {
          console.warn('[PWA Recovery] App not rendered after 5s, forcing refresh');
          sessionStorage.setItem(REFRESH_KEY, 'true');
          window.location.reload();
        }
      }, 5000);

      // React will call this when mounted to cancel the timeout
      window.__cancelAppRecovery = function () {
        clearTimeout(appReadyTimeout);
        var loader = document.getElementById('app-loader');
        if (!loader) return;

        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          loader.remove();
          return;
        }

        var observer = new MutationObserver(function () {
          if (root && root.children.length > 0) {
            observer.disconnect();
            loader.remove();
          }
        });
        if (root) observer.observe(root, { childList: true });
      };
    })();
  </script>
</head>

<body style="background-color: #ffffff; margin: 0; padding: 0;">
  <!-- Recovery/Loading UI (never shows blank white screen) -->
  <div id="app-loader">
    <div class="brand">CleverDining</div>
    <div class="spinner"></div>
    <div id="loader-status" class="status">Loading…</div>
    <div id="offline-msg" class="offline-msg">You are offline. Please check your connection.</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
