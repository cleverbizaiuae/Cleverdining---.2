<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>CleverDining</title>
  <!-- Preconnect to API backend for faster first requests -->
  <link rel="preconnect" href="https://cleverdining-2.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://cleverdining-2.onrender.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">

  <!-- Recovery UI styles (inline to prevent blank screen) -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: opacity 0.3s ease;
    }

    #app-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #app-loader .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E5E7EB;
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #app-loader .brand {
      font-size: 22px;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    #app-loader .status {
      font-size: 13px;
      color: #94A3B8;
      margin-top: 12px;
    }

    #app-loader .offline-msg {
      font-size: 14px;
      color: #EF4444;
      margin-top: 8px;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- PWA Smart Refresh Guard (runs BEFORE React to prevent blank screens) -->
  <script>
    (function () {
      'use strict';

      // -- Offline detection --
      if (!navigator.onLine) {
        window.addEventListener('DOMContentLoaded', function () {
          var el = document.getElementById('offline-msg');
          if (el) el.style.display = 'block';
          var status = document.getElementById('loader-status');
          if (status) status.textContent = 'Waiting for connection…';
        });
        // Listen for reconnection, then reload
        window.addEventListener('online', function () {
          window.location.reload();
        });
        return; // Don't auto-refresh while offline
      }

      // -- Build version check --
      var STORED_VERSION_KEY = 'cleverdining_build_version';

      // -- Auto-refresh guard (max 1 per session) --
      var REFRESH_KEY = 'cleverdining_auto_refreshed';
      var alreadyRefreshed = sessionStorage.getItem(REFRESH_KEY) === 'true';

      // 5-second timeout: if app hasn't rendered, force ONE refresh
      var appReadyTimeout = setTimeout(function () {
        var root = document.getElementById('root');
        // Check if React has actually rendered content
        if (root && root.children.length === 0 && !alreadyRefreshed) {
          console.warn('[PWA Recovery] App not rendered after 5s, forcing refresh');
          sessionStorage.setItem(REFRESH_KEY, 'true');
          // Clear all caches before refresh
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      }, 5000);

      // React will call this when mounted to cancel the timeout
      window.__cancelAppRecovery = function () {
        clearTimeout(appReadyTimeout);
        // Hide the loader
        var loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function () { loader.remove(); }, 300);
        }
      };
    })();
  </script>
</head>

<body>
  <!-- Recovery/Loading UI (never shows blank white screen) -->
  <div id="app-loader">
    <div class="brand">CleverDining</div>
    <div class="spinner"></div>
    <div id="loader-status" class="status">Loading…</div>
    <div id="offline-msg" class="offline-msg">You are offline. Please check your connection.</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
