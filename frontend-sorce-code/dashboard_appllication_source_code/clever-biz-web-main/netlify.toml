[build]
  command = "CI=false npm install && npm run build"
  publish = "dist"

[build.environment]
  # API URL defaults to /api which uses the proxy below
  VITE_API_URL = "/api"
  VITE_WS_URL = "wss://cleverdining-2.onrender.com"

# API proxy redirect (must come first)
[[redirects]]
  from = "/api/*"
  to = "https://cleverdining-2.onrender.com/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

# SPA fallback - redirect all other routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- DURABLE CACHE HEADERS ---

# Static assets (JS, CSS) - Vite fingerprints these, so aggressive caching is safe
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable, durable"

# Images and fonts
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

# HTML pages - browsers still revalidate, but Netlify edge can serve the SPA
# shell quickly for client-side routes instead of forwarding every path miss.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store, max-age=0"

