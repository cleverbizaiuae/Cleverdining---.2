name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E tests"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend_source_code/Restaurants
    env:
      USE_SQLITE: "1"
      SECRET_KEY: ci-secret-key
      DEBUG: "1"
      REDIS_HOST: ""
      REDIS_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend_source_code/Restaurants/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend migrations
        run: python manage.py migrate --noinput

      - name: Django system checks
        run: python manage.py check

      - name: Backend smoke tests
        run: python manage.py test accounts device payment restaurant --verbosity=2

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-sorce-code/dashboard_appllication_source_code/clever-biz-web-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-sorce-code/dashboard_appllication_source_code/clever-biz-web-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

  mobile-build:
    name: Mobile Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-sorce-code/device_application_source_code/clever-biz-mobile-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-sorce-code/device_application_source_code/clever-biz-mobile-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build mobile web app
        run: npm run build

  playwright-e2e:
    name: Playwright E2E (Manual)
    runs-on: ubuntu-latest
    needs:
      - backend-checks
      - dashboard-build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-sorce-code/dashboard_appllication_source_code/clever-biz-web-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-sorce-code/dashboard_appllication_source_code/clever-biz-web-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e -- --project=chromium --reporter=list
