# TEMPORARY: dump the full Django route table for the QA API audit. Never merged.
name: QA route table
on:
  push:
    branches:
      - qa/full-app-check
    paths:
      - ".github/qa/**"
      - ".github/workflows/qa-urls.yml"
env:
  USE_SQLITE: "1"
  SECRET_KEY: qa-secret-key
  DEBUG: "1"
  REDIS_HOST: ""
  REDIS_URL: ""
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend_source_code/Restaurants
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend_source_code/Restaurants/requirements.txt
      - run: pip install -r requirements.txt
      - run: python ../../.github/qa/dump_urls.py > /tmp/routes.json
      - uses: actions/upload-artifact@v4
        with:
          name: routes
          path: /tmp/routes.json
